name: Daily Wikipedia top 1000

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to fetch (YYYY-MM-DD). Defaults to yesterday."
        required: false
        type: string

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Fetch top 1000 articles
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi
          python3 scripts/fetch_top_articles.py \
            --user-agent "wikipedia-top-1000/1.0 (+https://github.com/${{ github.repository }})" \
            "${args[@]}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'data/top-1000-*.csv'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          file=$(git diff --cached --name-only | head -n 1)
          day=${file#data/top-1000-}
          git commit -m "Add Wikipedia top 1000 pageviews for ${day%.csv}"
          git push
