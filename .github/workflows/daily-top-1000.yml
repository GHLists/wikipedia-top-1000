name: Daily Wikipedia top 1000

on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to fetch (YYYY-MM-DD). Defaults to yesterday."
        required: false
        type: string
      runner:
        description: "Runner label to run on. Defaults to the primary runner."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-top-1000
  cancel-in-progress: false

jobs:
  primary:
    uses: ./.github/workflows/fetch.yml
    with:
      runner: ${{ inputs.runner || vars.RUNNER_PRIMARY || 'self-hosted' }}
      date: ${{ inputs.date }}

  backup:
    needs: primary
    if: ${{ failure() || cancelled() }}
    uses: ./.github/workflows/fetch.yml
    with:
      runner: ${{ vars.RUNNER_BACKUP || 'ubuntu-latest' }}
      date: ${{ inputs.date }}
